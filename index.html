<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrosFort | 占いポータル</title>
  <style>
    :root {
      --bg: #0f1117;
      --bg-soft: #151827;
      --surface: #1c2030;
      --surface-strong: #252b40;
      --border: #303750;
      --text: #eef1f8;
      --muted: #a8b0c2;
      --hint: #747d96;
      --accent: #8174ff;
      --accent-2: #6b5fee;
      --green: #06c755;
      --gold: #fbbf24;
      --danger: #f87171;
      --shadow: rgba(0, 0, 0, .38);
    }

    body.light {
      --bg: #f0f4f8;
      --bg-soft: #e4e9f0;
      --surface: #ffffff;
      --surface-strong: #f7f9fc;
      --border: #d5ddec;
      --text: #1a1d23;
      --muted: #5c667c;
      --hint: #8b94a8;
      --accent: #5b4fe0;
      --accent-2: #4a3ecf;
      --green: #059950;
      --gold: #b45309;
      --danger: #dc2626;
      --shadow: rgba(31, 41, 55, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Helvetica Neue", Arial, "Noto Sans JP", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(129, 116, 255, .24), transparent 28rem),
        radial-gradient(circle at 82% 12%, rgba(6, 199, 85, .14), transparent 24rem),
        linear-gradient(160deg, var(--bg), #090b12 70%);
    }

    body.light {
      background:
        radial-gradient(circle at 20% 20%, rgba(91, 79, 224, .18), transparent 28rem),
        radial-gradient(circle at 82% 12%, rgba(5, 153, 80, .12), transparent 24rem),
        linear-gradient(160deg, var(--bg), #dde5ef 70%);
    }

    button,
    input,
    select { font: inherit; }

    .shell {
      width: min(980px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 32px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1.12fr .88fr;
      gap: 22px;
      align-items: center;
      padding: 28px;
      border: 1px solid var(--border);
      border-radius: 26px;
      background: rgba(28, 32, 48, .82);
      box-shadow: 0 22px 80px var(--shadow);
      backdrop-filter: blur(16px);
    }

    body.light .hero { background: rgba(255, 255, 255, .84); }

    .brand {
      display: inline-flex;
      gap: 9px;
      align-items: center;
      margin-bottom: 14px;
      letter-spacing: 3px;
      font-weight: 900;
      color: var(--accent);
    }

    .brand span { color: var(--green); }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 4.6rem);
      line-height: .98;
      letter-spacing: -.05em;
    }

    .lead {
      max-width: 34rem;
      margin: 16px 0 0;
      color: var(--muted);
      line-height: 1.75;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: 11px 18px;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
      transition: transform .18s, box-shadow .18s, background .18s;
    }

    .btn:hover { transform: translateY(-2px); }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent), var(--green));
      box-shadow: 0 10px 28px rgba(129, 116, 255, .28);
    }

    .btn.ghost {
      color: var(--text);
      border: 1px solid var(--border);
      background: var(--surface-strong);
    }

    .crystal-card {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 280px;
      border: 1px solid var(--border);
      border-radius: 22px;
      background:
        linear-gradient(145deg, rgba(129, 116, 255, .20), rgba(6, 199, 85, .10)),
        var(--bg-soft);
    }

    .orb {
      width: 164px;
      height: 164px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-size: 4.6rem;
      background: radial-gradient(circle at 35% 30%, #fff, #a78bfa 22%, #6b5fee 54%, #151827 72%);
      box-shadow: 0 0 38px rgba(129, 116, 255, .6), inset 0 0 36px rgba(255, 255, 255, .25);
      animation: float 3.2s ease-in-out infinite;
    }

    .sparkles {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .sparkles i {
      position: absolute;
      color: var(--gold);
      opacity: .82;
      animation: twinkle 2.4s ease-in-out infinite;
    }

    .sparkles i:nth-child(1) { top: 18%; left: 18%; animation-delay: .1s; }
    .sparkles i:nth-child(2) { top: 24%; right: 19%; animation-delay: .7s; }
    .sparkles i:nth-child(3) { bottom: 24%; left: 26%; animation-delay: 1.1s; }
    .sparkles i:nth-child(4) { bottom: 18%; right: 27%; animation-delay: 1.7s; }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 310px;
      gap: 18px;
      margin-top: 18px;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: 22px;
      background: rgba(28, 32, 48, .86);
      box-shadow: 0 16px 50px var(--shadow);
      overflow: hidden;
    }

    body.light .panel { background: rgba(255, 255, 255, .88); }

    .tabs {
      display: flex;
      gap: 6px;
      padding: 10px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      background: var(--bg-soft);
    }

    .tab {
      flex: 1 0 108px;
      border: 0;
      border-radius: 14px;
      padding: 10px 8px;
      background: transparent;
      color: var(--hint);
      font-weight: 800;
      cursor: pointer;
    }

    .tab.active {
      color: #fff;
      background: var(--accent);
    }

    .fortune-body { padding: 16px; }

    .chat {
      min-height: 300px;
      max-height: 430px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      border-radius: 16px;
      background: var(--bg);
    }

    .bubble-row { display: flex; }
    .bubble-row.mine { justify-content: flex-end; }

    .bubble {
      max-width: 82%;
      padding: 11px 14px;
      border-radius: 16px;
      line-height: 1.65;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: var(--surface-strong);
      border: 1px solid var(--border);
    }

    .mine .bubble {
      color: #fff;
      border: 0;
      background: #344269;
      border-bottom-right-radius: 4px;
    }

    .result-bubble {
      color: #fff;
      border: 0;
      font-weight: 800;
      text-shadow: 0 1px 4px rgba(0, 0, 0, .35);
      background: linear-gradient(135deg, #5b4fe0, #a78bfa 50%, #059950);
      animation: reveal .55s cubic-bezier(.22, 1, .36, 1) both;
    }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .input-grid input,
    .input-grid select {
      width: 100%;
      padding: 12px 13px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: 0;
      background: var(--bg-soft);
    }

    .input-grid input:focus,
    .input-grid select:focus { border-color: var(--accent); }

    .send-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .send-row input {
      flex: 1;
      min-width: 0;
      padding: 13px 15px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 999px;
      outline: 0;
      background: var(--bg-soft);
    }

    .send {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
      font-size: 1.2rem;
      transition: transform .15s, opacity .15s;
    }

    .send:active { transform: scale(.93); }
    .send:disabled { opacity: .45; cursor: wait; }

    .side { padding: 16px; }

    .side h2 {
      margin: 0 0 4px;
      font-size: 1.05rem;
    }

    .side p {
      margin: 0 0 14px;
      color: var(--hint);
      font-size: .85rem;
      line-height: 1.6;
    }

    .score-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-bottom: 14px;
    }

    .score-card {
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--bg-soft);
      text-align: center;
    }

    .score-num {
      font-size: 1.6rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 900;
      color: var(--accent);
    }

    .score-label {
      margin-top: 2px;
      color: var(--hint);
      font-size: .72rem;
    }

    .history {
      display: grid;
      gap: 8px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--bg-soft);
    }

    .history-result { font-weight: 900; color: var(--gold); }
    .history-meta { margin-top: 2px; color: var(--hint); font-size: .75rem; }

    .empty {
      padding: 18px;
      color: var(--hint);
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 14px;
    }

    .loader {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .loader span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce .9s ease-in-out infinite;
    }

    .loader span:nth-child(2) { animation-delay: .15s; }
    .loader span:nth-child(3) { animation-delay: .3s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-12px) rotate(3deg); }
    }

    @keyframes twinkle {
      0%, 100% { transform: scale(.7); opacity: .25; }
      50% { transform: scale(1.4); opacity: 1; }
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(.45); opacity: .35; }
      40% { transform: scale(1); opacity: 1; }
    }

    @keyframes reveal {
      from { transform: translateY(18px) scale(.92); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    @media (max-width: 820px) {
      .hero,
      .app { grid-template-columns: 1fr; }
      .crystal-card { min-height: 220px; }
    }

    @media (max-width: 520px) {
      .shell { width: min(100% - 18px, 980px); padding-top: 10px; }
      .hero { padding: 20px; border-radius: 20px; }
      .input-grid { grid-template-columns: 1fr; }
      .bubble { max-width: 92%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero" aria-labelledby="pageTitle">
      <div>
        <div class="brand">Cros<span>Fort</span></div>
        <h1 id="pageTitle">占いっぽいサイトを、ちゃんと楽しく。</h1>
        <p class="lead">名前や星座を入れるだけで、今日の運勢・恋愛・勉強・星座のメッセージをチャット風に表示します。履歴はブラウザに保存されるので、あとから見返せます。</p>
        <div class="hero-actions">
          <button class="btn primary" type="button" id="startBtn">🔮 さっそく占う</button>
          <button class="btn ghost" type="button" id="themeBtn">🌙 テーマ切替</button>
        </div>
      </div>
      <div class="crystal-card" aria-hidden="true">
        <div class="sparkles"><i>✨</i><i>✦</i><i>⭐</i><i>✧</i></div>
        <div class="orb">🔮</div>
      </div>
    </section>

    <section class="app" id="fortuneApp" aria-label="占いアプリ">
      <div class="panel">
        <div class="tabs" id="tabs"></div>
        <div class="fortune-body">
          <div class="chat" id="chat" aria-live="polite"></div>
          <div class="input-grid">
            <select id="zodiacInput" aria-label="星座">
              <option value="">星座を選択（任意）</option>
              <option>おひつじ座</option><option>おうし座</option><option>ふたご座</option><option>かに座</option>
              <option>しし座</option><option>おとめ座</option><option>てんびん座</option><option>さそり座</option>
              <option>いて座</option><option>やぎ座</option><option>みずがめ座</option><option>うお座</option>
            </select>
            <input id="extraInput" type="text" placeholder="気になること（任意）">
          </div>
          <div class="send-row">
            <input id="nameInput" type="text" placeholder="あなたの名前を入力" autocomplete="name">
            <button class="send" id="sendBtn" type="button" aria-label="占う">➤</button>
          </div>
        </div>
      </div>

      <aside class="panel side">
        <h2>📊 占い履歴</h2>
        <p>この端末のブラウザに保存されます。気軽に試せるデモ用です。</p>
        <div class="score-grid">
          <div class="score-card"><div class="score-num" id="totalCount">0</div><div class="score-label">占った回数</div></div>
          <div class="score-card"><div class="score-num" id="luckyCount">0</div><div class="score-label">大吉・中吉</div></div>
        </div>
        <div class="history" id="history"></div>
      </aside>
    </section>
  </main>

  <script>
    const FORTUNES = {
      today: {
        label: "今日の運勢",
        greeting: "今日はどんな流れが来ているか、水晶玉で見てみましょう。",
        comments: ["小さな行動が大きなチャンスに変わる日です。", "いつもより丁寧に進めると、良い流れをつかめます。", "人の言葉にヒントが隠れています。", "迷ったら、明るい方を選ぶと吉です。"]
      },
      love: {
        label: "恋愛",
        greeting: "気になる人との距離感や、あなたの魅力の出し方を占います。",
        comments: ["素直な一言が関係を動かします。", "聞き役にまわると好印象です。", "焦らず自然体でいるほど魅力が伝わります。", "小さな約束を大切にすると運気アップ。"]
      },
      study: {
        label: "勉強",
        greeting: "集中力・目標達成・テスト運を読み取ります。",
        comments: ["短時間でも毎日続ける作戦が最強です。", "苦手を一つだけ選んで潰すと成果が出ます。", "朝の復習が記憶を助けます。", "今日は暗記より問題演習が吉。"]
      },
      zodiac: {
        label: "星座",
        greeting: "星座の流れから、今のあなたへのメッセージを届けます。",
        comments: ["新しい予定を入れると運気が動き出します。", "整えることが開運につながります。", "直感のメモを残すと後で役に立ちます。", "好きな音楽が気分を切り替えてくれます。"]
      }
    };

    const RESULTS = ["大吉", "中吉", "小吉", "末吉", "吉", "凶", "大凶"];
    const RESULT_EMOJI = { 大吉: "🌈", 中吉: "✨", 小吉: "🌸", 末吉: "🍀", 吉: "⭐", 凶: "🌧", 大凶: "🌑" };
    const STORAGE_KEY = "crosFortStandaloneHistory";
    let currentType = "today";
    let busy = false;

    const tabs = document.getElementById("tabs");
    const chat = document.getElementById("chat");
    const nameInput = document.getElementById("nameInput");
    const zodiacInput = document.getElementById("zodiacInput");
    const extraInput = document.getElementById("extraInput");
    const sendBtn = document.getElementById("sendBtn");

    function buildTabs() {
      tabs.innerHTML = Object.entries(FORTUNES).map(([key, fortune]) =>
        `<button class="tab${key === currentType ? " active" : ""}" type="button" data-type="${key}">${fortune.label}</button>`
      ).join("");
    }

    function switchType(type) {
      currentType = type;
      buildTabs();
      chat.innerHTML = "";
      addBubble("other", `${FORTUNES[type].greeting}\n名前を入力して、占いを始めてください。`);
    }

    function addBubble(side, text, result) {
      const row = document.createElement("div");
      row.className = `bubble-row ${side}`;
      const bubble = document.createElement("div");
      bubble.className = `bubble${result ? " result-bubble" : ""}`;
      bubble.textContent = text;
      row.appendChild(bubble);
      chat.appendChild(row);
      chat.scrollTop = chat.scrollHeight;
    }

    function hashText(text) {
      let hash = 0;
      for (let i = 0; i < text.length; i += 1) hash = (hash * 31 + text.charCodeAt(i)) % 1000003;
      return hash;
    }

    function runFortune() {
      if (busy) return;
      const name = nameInput.value.trim();
      if (!name) {
        nameInput.focus();
        return;
      }
      const zodiac = zodiacInput.value;
      const extra = extraInput.value.trim();
      const today = new Date().toDateString();
      const seed = hashText([currentType, name, zodiac, extra, today].join("|"));
      const result = RESULTS[Math.abs(seed) % RESULTS.length];
      const comments = FORTUNES[currentType].comments;
      const comment = comments[Math.abs(hashText(result + name + currentType)) % comments.length];
      const detail = [name, zodiac, extra].filter(Boolean).join(" / ");

      addBubble("mine", detail);
      busy = true;
      sendBtn.disabled = true;
      addBubble("other", "星の声を聴いています…  ✨");

      setTimeout(() => {
        chat.lastElementChild.remove();
        const emoji = RESULT_EMOJI[result] || "🔮";
        const message = `${emoji} ${result}\n${comment}\n\nラッキーアクション：${luckyAction(seed)}`;
        addBubble("other", message, result);
        saveHistory({ type: currentType, label: FORTUNES[currentType].label, result, detail, date: new Date().toISOString() });
        nameInput.value = "";
        busy = false;
        sendBtn.disabled = false;
      }, 900);
    }

    function luckyAction(seed) {
      const actions = ["深呼吸してから始める", "机の上を3分だけ片付ける", "青いものを身につける", "ありがとうを一回多く言う", "水を飲んでリセットする", "早めに寝る準備をする"];
      return actions[Math.abs(seed) % actions.length];
    }

    function readHistory() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
      catch { return []; }
    }

    function saveHistory(item) {
      const history = [item, ...readHistory()].slice(0, 20);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const history = readHistory();
      document.getElementById("totalCount").textContent = history.length;
      document.getElementById("luckyCount").textContent = history.filter(item => ["大吉", "中吉"].includes(item.result)).length;
      const historyEl = document.getElementById("history");
      if (!history.length) {
        historyEl.innerHTML = '<div class="empty">まだ履歴がありません</div>';
        return;
      }
      historyEl.innerHTML = history.slice(0, 6).map(item => {
        const date = new Date(item.date).toLocaleString("ja-JP", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
        return `<div class="history-item"><div><div class="history-result">${item.result}</div><div class="history-meta">${item.label} ／ ${date}</div></div><div class="history-meta">${escapeHtml(item.detail)}</div></div>`;
      }).join("");
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" }[char]));
    }

    function applyTheme(light) {
      document.body.classList.toggle("light", light);
      localStorage.setItem("crosFortTheme", light ? "light" : "dark");
    }

    tabs.addEventListener("click", event => {
      const button = event.target.closest(".tab");
      if (button) switchType(button.dataset.type);
    });
    sendBtn.addEventListener("click", runFortune);
    nameInput.addEventListener("keydown", event => { if (event.key === "Enter") runFortune(); });
    document.getElementById("startBtn").addEventListener("click", () => nameInput.focus());
    document.getElementById("themeBtn").addEventListener("click", () => applyTheme(!document.body.classList.contains("light")));

    const savedTheme = localStorage.getItem("crosFortTheme");
    applyTheme(savedTheme ? savedTheme === "light" : window.matchMedia("(prefers-color-scheme: light)").matches);
    buildTabs();
    switchType(currentType);
    renderHistory();
  </script>
</body>
</html>
